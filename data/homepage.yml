hero_headline: "Where AI testing becomes a discipline."
hero_subtext: "Practical guides, real evaluation frameworks, and a growing community for people who test AI systems for a living — not for the leaderboard."
about_text: |
  I'm an independent AI evaluation consultant. I help teams understand how their models behave in real-world use through structured human testing — and I started AI Testing Lab to share what that work actually looks like.
pull_quote: "A model that's never been evaluated by humans hasn't been evaluated. It's been benchmarked."
